selection_policy:
  identity_is_fixed: true
  cover_concept_from_article: true
  rule: "先由文章决定隐喻、空间关系和动作；封面研究图用于理解设计方法，图像生成只加载需要的人物身份参考。"

identity_reference:
  standard_cover:
    - file: "identity/standard/master.png"
      role: "封面标准形象母版：脸、发型、帽子、配色与成年比例"
      load_when: "文章封面默认，或标准形态需要锁定身份"
    - file: "identity/standard/views/front.png"
      role: "标准形态正面结构"
      load_when: "正面或对称构图需要补充角度参考"
    - file: "identity/standard/views/left-profile.png"
      role: "标准形态左侧结构"
      load_when: "纯侧面构图"
    - file: "identity/standard/views/rear-three-quarter.png"
      role: "标准形态后侧结构"
      load_when: "回头或后侧构图"
    - file: "identity/standard/views/back.png"
      role: "标准形态背面结构"
      load_when: "背影构图"
    - file: "identity/standard/head/front.png"
      role: "正面头部结构"
      load_when: "正面头肩近景需要校准脸和帽型"
    - file: "identity/standard/head/front-three-quarter.png"
      role: "正面三分之四头部结构"
      load_when: "三分之四头肩近景需要校准脸和帽型"
    - file: "identity/standard/head/left-profile.png"
      role: "左侧头部结构"
      load_when: "侧面头肩近景"
    - file: "identity/standard/head/back.png"
      role: "后脑、帽扣与后发结构"
      load_when: "背面头肩近景"

  article_q:
    - file: "identity/article-q/master-front.png"
      role: "正文 Q 版正面母版：大头帽、短躯短腿、服装与身份轮廓"
      load_when: "常规正文全身，或需要锁定 Q 版比例"
    - file: "identity/article-q/views/front-three-quarter.png"
      role: "正文 Q 版正面三分之四结构"
      load_when: "正文正面三分之四全身构图"
    - file: "identity/article-q/views/left-profile.png"
      role: "正文 Q 版左侧结构"
      load_when: "正文侧面全身构图"
    - file: "identity/article-q/views/back.png"
      role: "正文 Q 版背面结构"
      load_when: "正文背面全身构图"

cover_examples:
  rule: "封面规划时阅读 references/cover-examples.md，按需观察成图，提炼布局、发散、人物参与和标题判断。案例不作为图像生成输入、人物比例参考或固定版式；生成时根据当前文章写出新的封面方案。"
  editorial:
    - file: "cover/editorial-examples/seed-miniature-room.png"
      role: "近景人物、微缩场景与标题的体量关系"
      load_when: "规划近景人物与主对象的体量关系时，供观察分析"
    - file: "cover/editorial-examples/nano-work.png"
      role: "安静人物、工作主题与留白中的标题关系"
      load_when: "规划安静语气和标题留白时，供观察分析"
    - file: "cover/editorial-examples/remote-assistance.png"
      role: "人物、截图与远程屏幕之间的动作关系"
      load_when: "规划人物如何连接两个叙事对象时，供观察分析"
  concept_studies:
    - file: "cover/concept-studies/qwen-branching.png"
      role: "一个起点展开多种结果的封面构思"
      load_when: "理解多结果关系如何组织为画面时，供观察分析"
    - file: "cover/concept-studies/hyper3d-forward.png"
      role: "进入有明显视觉质感的产品世界"
      load_when: "理解进入场景的动势与标题融合时，供观察分析"
    - file: "cover/concept-studies/fighting-skill-impact.png"
      role: "动作技能的瞬间冲击"
      load_when: "理解前景动作的视觉重心时，供观察分析"
    - file: "cover/concept-studies/teach-once-causal.png"
      role: "一次示范触发后续步骤的封面构思"
      load_when: "理解因果路径与人物触发动作时，供观察分析"
